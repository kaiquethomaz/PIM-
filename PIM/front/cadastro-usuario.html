<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Usuário</title>

  <link rel="stylesheet" href="global.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<div class="container">

  <div class="sidebar">
    <h2 id="nomeComercio">NexaFlow</h2>

    <ul>

      <li class="somente-admin-gerente" onclick="ir('dashboard.html')">
        <span class="material-icons">dashboard</span>
        Dashboard
      </li>

      <li onclick="ir('estoque.html')">
        <span class="material-icons">inventory_2</span>
        Estoque
      </li>

      <li onclick="ir('vendas.html')">
        <span class="material-icons">point_of_sale</span>
        Vendas
      </li>

      <li class="somente-admin-gerente" onclick="ir('relatorios.html')">
        <span class="material-icons">bar_chart</span>
        Relatórios
      </li>

      <li class="somente-admin" onclick="ir('configuracoes.html')">
        <span class="material-icons">settings</span>
        Configurações
      </li>

      <li class="ativo somente-admin" onclick="ir('cadastro-usuario.html')">
        <span class="material-icons">person_add</span>
        Usuários
      </li>

      <li onclick="logout()">
        <span class="material-icons">logout</span>
        Sair
      </li>

    </ul>
  </div>

  <div class="content">
    <h1>Cadastrar Usuário</h1>

    <div class="produto-form">
      <input type="text" id="nome" placeholder="Nome do usuário">
      <input type="email" id="email" placeholder="E-mail">
      <input type="password" id="senha" placeholder="Senha">
      <input type="password" id="confirmarSenha" placeholder="Confirme a senha">

      <p><strong>Perfil:</strong> Administrador</p>

      <p id="erro"></p>

      <button onclick="cadastrarUsuario()">Cadastrar usuário</button>
    </div>
  </div>

</div>

<script src="js/global.js"></script>
<script src="js/cadastro-usuario.js"></script>

</body>
</html>
